{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<section class="form-card narrow"><div class="eyebrow">STUDENT ACCESS</div><h1>Create your account</h1><p class="muted">Create an account to submit and track complaints.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" maxlength="100" required autocomplete="name"></label><label>College email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="btn primary full" type="submit">Create account</button></form><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
